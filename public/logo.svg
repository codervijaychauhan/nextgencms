<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Vibrant Blue Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#1884f7" />
  
  <!-- Globe Outer Boundary Ring -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#ffffff" stroke-width="18" />
  
  <!-- Equator (Horizontal) -->
  <line x1="94" y1="256" x2="418" y2="256" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  
  <!-- Prime Meridian (Vertical) -->
  <line x1="256" y1="94" x2="256" y2="418" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  
  <!-- Longitudes (Vertical Ellipse) -->
  <ellipse cx="256" cy="256" rx="84" ry="162" fill="none" stroke="#ffffff" stroke-width="18" />
  
  <!-- Latitudes (Upper & Lower Arcs) -->
  <path d="M125 178 Q256 220 387 178" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  <path d="M125 334 Q256 292 387 334" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
</svg>